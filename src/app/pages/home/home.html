<!-- Categorías -->
<div class="categories-strip py-2">
  <div class="container d-flex flex-wrap gap-2">
    <button class="category-chip active">Todos</button>
    <button class="category-chip">Laptops</button>
    <button class="category-chip">Celulares</button>
    <button class="category-chip">Audio</button>
    <button class="category-chip">Wearables</button>
    <button class="category-chip">Periféricos</button>
    <button class="category-chip">Tablets</button>
    <button class="category-chip">Accesorios</button>
    <button class="category-chip">Cámaras</button>
    <button class="category-chip">Consolas y videojuegos</button>
  </div>
</div>

<!-- Carrusel promocional -->
<div
  id="promoCarousel"
  class="carousel slide"
  data-bs-ride="carousel"
>

  <!-- Indicadores -->
  <div class="carousel-indicators">
    <button
      type="button"
      data-bs-target="#promoCarousel"
      data-bs-slide-to="0"
      class="active"
      aria-current="true"
      aria-label="Slide 1"
    ></button>

    <button
      type="button"
      data-bs-target="#promoCarousel"
      data-bs-slide-to="1"
      aria-label="Slide 2"
    ></button>

    <button
      type="button"
      data-bs-target="#promoCarousel"
      data-bs-slide-to="2"
      aria-label="Slide 3"
    ></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner">

    <!-- Slide 1 -->
    <div class="carousel-item active">
      <div class="carousel-banner banner-ofertas">
        <div class="container">
          <div class="row align-items-center py-5">

            <div class="col-md-6 text-white">
              <h2 class="fw-bold mb-3">
                Ofertas de Verano
              </h2>

              <p class="lead mb-4">
                Hasta 50% de descuento en laptops y tablets
              </p>

              <button class="btn btn-light btn-lg">
                Ver ofertas
              </button>
            </div>

            <div class="col-md-6 text-center">
              <div class="carousel-icon">
                💻
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="carousel-item">
      <div class="carousel-banner banner-lanzamientos">
        <div class="container">
          <div class="row align-items-center py-5">

            <div class="col-md-6 text-white">
              <h2 class="fw-bold mb-3">
                Nuevos Lanzamientos
              </h2>

              <p class="lead mb-4">
                Descubre los últimos smartphones y wearables
              </p>

              <button class="btn btn-light btn-lg">
                Explorar
              </button>
            </div>

            <div class="col-md-6 text-center">
              <div class="carousel-icon">
                📱
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Slide 3 -->
    <div class="carousel-item">
      <div class="carousel-banner banner-envio">
        <div class="container">
          <div class="row align-items-center py-5">

            <div class="col-md-6 text-white">
              <h2 class="fw-bold mb-3">
                Envío Gratis
              </h2>

              <p class="lead mb-4">
                En compras superiores a S/.50 en todo el catálogo
              </p>

              <button class="btn btn-light btn-lg">
                Comprar ahora
              </button>
            </div>

            <div class="col-md-6 text-center">
              <div class="carousel-icon">
                🚚
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Botón anterior -->
  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#promoCarousel"
    data-bs-slide="prev"
  >
    <span
      class="carousel-control-prev-icon"
      aria-hidden="true"
    ></span>

    <span class="visually-hidden">
      Anterior
    </span>
  </button>

  <!-- Botón siguiente -->
  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#promoCarousel"
    data-bs-slide="next"
  >
    <span
      class="carousel-control-next-icon"
      aria-hidden="true"
    ></span>

    <span class="visually-hidden">
      Siguiente
    </span>
  </button>

</div>
