<!-- Contenido principal -->
<main class="container my-4">

  <div
    class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
  >
    <div>
      <h4 class="fw-semibold mb-1">
        Mis favoritos
      </h4>

      <p class="text-muted mb-0">
        Productos guardados desde el catálogo.
      </p>
    </div>

    <a
      routerLink="/home"
      class="btn btn-outline-secondary rounded-pill"
    >
      ← Volver al catálogo
    </a>
  </div>


  <!-- Estado vacío -->
  @if (favoritos.length === 0) {

    <div class="card border-0 shadow-sm p-4">

      <div class="d-flex align-items-center gap-3">

        <div class="empty-heart">
          ❤
        </div>

        <div>
          <h6 class="fw-semibold mb-1">
            Aún no tienes favoritos
          </h6>

          <p class="text-muted mb-0">
            Vuelve al catálogo y marca productos con ❤.
          </p>
        </div>

      </div>

    </div>

  } @else {

    <!-- Productos favoritos -->
    <div class="row g-3">

      @for (producto of favoritos; track producto.id) {

        <div class="col-sm-6 col-md-4 col-lg-3">

          <article class="product-card h-100">

            <div class="product-image-wrapper">

              <img
                [src]="producto.img"
                [alt]="producto.title"
              >

              <button
                type="button"
                class="fav-remove"
                (click)="eliminarFavorito(producto.id)"
                title="Quitar de favoritos"
              >
                ❤
              </button>

            </div>

            <div class="product-body">

              <h6 class="product-title">
                {{ producto.title }}
              </h6>

              <div class="product-price-new">
                S/ {{ producto.price }}
              </div>

              <button
                type="button"
                class="btn btn-outline-danger rounded-pill w-100 mt-2"
                (click)="eliminarFavorito(producto.id)"
              >
                Quitar de favoritos
              </button>

            </div>

          </article>

        </div>

      }

    </div>

  }

</main>
