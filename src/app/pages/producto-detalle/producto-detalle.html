<main class="container my-4 product-detail">

  <!-- Migas de pan -->
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb small">

      <li class="breadcrumb-item">
        <a routerLink="/home">Inicio</a>
      </li>

      <li class="breadcrumb-item">
        <a href="#">Laptops</a>
      </li>

      <li
        class="breadcrumb-item active"
        aria-current="page"
      >
        Laptop Gaming HP OMEN 16
      </li>

    </ol>
  </nav>


  <!-- Galería del producto -->
  <div class="row g-4">

    <div class="col-lg-6">

      <div class="product-gallery card border-0 shadow-sm">

        <!-- Imagen principal -->
        <div class="product-gallery-main">

          <img
            [src]="imagenPrincipal"
            alt="Laptop Gaming HP OMEN 16"
          >

          <span class="badge-discount badge-detail">
            24% OFF
          </span>

          <span class="badge-shipping badge-detail">
            Envío gratis
          </span>

        </div>


        <!-- Miniaturas -->
        <div class="product-gallery-thumbs">

          @for (imagen of imagenes; track imagen.completa) {

          <img
            [src]="imagen.miniatura"
            [alt]="imagen.alt"
            class="thumb"
            [class.active]="imagenPrincipal === imagen.completa"
            (click)="cambiarImagen(imagen.completa)"
          >

       }

      </div>
      </div>

    </div>

  </div>

</main>
