<div class="container py-5">

  <h2 class="mb-4">
    Finalizar compra
  </h2>

  <div class="row g-4">

    <!-- LADO IZQUIERDO -->
    <div class="col-lg-8">

      <!-- DATOS PERSONALES -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">

          <h5 class="card-title mb-3">
            Datos personales
          </h5>

          <div class="row">

            <div class="col-md-6 mb-3">
              <label class="form-label">
                Nombres
              </label>

              <input
                type="text"
                class="form-control"
                placeholder="Ingrese sus nombres">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">
                Apellidos
              </label>

              <input
                type="text"
                class="form-control"
                placeholder="Ingrese sus apellidos">
            </div>

          </div>

          <div class="row">

            <div class="col-md-6 mb-3">
              <label class="form-label">
                Correo electrónico
              </label>

              <input
                type="email"
                class="form-control"
                placeholder="correo@ejemplo.com">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">
                Teléfono
              </label>

              <input
                type="tel"
                class="form-control"
                placeholder="999 999 999">
            </div>

          </div>

        </div>
      </div>


      <!-- DIRECCIÓN -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">

          <h5 class="card-title mb-3">
            Dirección de entrega
          </h5>

          <div class="row">

            <div class="col-md-6 mb-3">
              <label class="form-label">
                Departamento
              </label>

              <select class="form-select">
                <option selected>Seleccione</option>
                <option>Lima</option>
                <option>Arequipa</option>
                <option>La Libertad</option>
                <option>Piura</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">
                Distrito
              </label>

              <input
                type="text"
                class="form-control"
                placeholder="Ingrese su distrito">
            </div>

          </div>

          <div class="mb-3">
            <label class="form-label">
              Dirección
            </label>

            <input
              type="text"
              class="form-control"
              placeholder="Av. / Jr. / Calle">
          </div>

          <div class="mb-3">
            <label class="form-label">
              Referencia
            </label>

            <textarea
              class="form-control"
              rows="2"
              placeholder="Referencia de la dirección"></textarea>
          </div>

        </div>
      </div>


      <!-- MÉTODO DE PAGO -->
      <div class="card shadow-sm">
        <div class="card-body">

          <h5 class="card-title mb-3">
            Método de pago
          </h5>

          <div class="form-check mb-2">
            <input
              class="form-check-input"
              type="radio"
              name="metodoPago"
              id="tarjeta">

            <label
              class="form-check-label"
              for="tarjeta">
              Tarjeta de crédito o débito
            </label>
          </div>

          <div class="form-check mb-2">
            <input
              class="form-check-input"
              type="radio"
              name="metodoPago"
              id="yape">

            <label
              class="form-check-label"
              for="yape">
              Yape / Plin
            </label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="metodoPago"
              id="contraEntrega">

            <label
              class="form-check-label"
              for="contraEntrega">
              Pago contra entrega
            </label>
          </div>

        </div>
      </div>

    </div>


    <!-- LADO DERECHO -->
    <div class="col-lg-4">

      <div class="card shadow-sm resumen-compra">

        <div class="card-body">

          <h5 class="card-title mb-4">
            Resumen de compra
          </h5>

          <div class="d-flex justify-content-between mb-2">
            <span>Producto</span>
            <span>S/ 2,500.00</span>
          </div>

          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span>S/ 2,500.00</span>
          </div>

          <div class="d-flex justify-content-between mb-3">
            <span>Envío</span>
            <span>S/ 15.00</span>
          </div>

          <hr>

          <div class="d-flex justify-content-between fw-bold mb-4">
            <span>Total</span>
            <span>S/ 2,515.00</span>
          </div>

          <button
            class="btn btn-primary w-100">
            Confirmar compra
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
