<main class="chat-shell"><header><div><h1>Malvino</h1><p>Ayuda con tu celular</p></div><button type="button" (click)="clear()">Borrar conversación</button></header>
<p class="notice">Asistente de respuestas programadas. Sin IA, backend ni APIs de pago. Las fichas de accesorios son ejemplos ficticios.</p>
<section class="checker" aria-labelledby="checker-title"><h2 id="checker-title">Comprobador de compatibilidad de ejemplo</h2><label for="accessory">Accesorio</label><select id="accessory" [(ngModel)]="accessory">@for(a of accessories;track a.id){<option [value]="a.id">{{a.name}}</option>}</select><label for="model">Modelo del celular</label><select id="model" [(ngModel)]="model">@for(m of models;track m){<option [value]="m">{{m}}</option>}</select><button type="button" (click)="check()">Comprobar compatibilidad</button></section>
<div class="suggestions"><button (click)="send('¿Este case sirve para un iPhone 13?')">Case para iPhone 13</button><button (click)="send('¿Esta batería sirve para Samsung A32?')">Batería para Samsung A32</button><button (click)="send('¿Cómo creo una cuenta?')">Crear cuenta</button></div>
<section #history class="messages" role="log" aria-live="polite" aria-label="Conversación con Malvino">@for(m of messages();track $index){<article [class.user]="m.role==='user'"><strong>{{m.role==='user'?'Tú':'Malvino'}}</strong><p>{{m.text}}</p></article>}</section>
<form (ngSubmit)="send()"><label for="message">Escribe tu consulta</label><div class="compose"><input id="message" name="message" [(ngModel)]="text" maxlength="500" autocomplete="off" placeholder="Ej.: ¿Esta batería sirve para Samsung A32?"><button type="submit" [disabled]="!text.trim()">Enviar</button></div></form></main>
