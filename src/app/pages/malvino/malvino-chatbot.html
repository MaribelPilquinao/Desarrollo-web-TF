<div class="chat-container">
  <div class="chat-header">
    <div class="bot-info">
      <div class="bot-avatar">🤖</div>
      <div>
        <h3>Malvino Assistant</h3>
        <span class="status-badge">En línea</span>
      </div>
    </div>
  </div>

  <div class="chat-body">
    <div *ngFor="let m of mensajes" [ngClass]="['mensaje', m.remitente]">
      <div class="burbuja">
        <p class="texto-mensaje">{{ m.texto }}</p>

        <!-- Tarjetas de productos sugeridos -->
        <div *ngIf="m.productos && m.productos.length > 0" class="productos-sugeridos">
          <div *ngFor="let p of m.productos" class="tarjeta-producto-chat">
            <img [src]="p.imagen_url" [alt]="p.nombre" class="producto-img" />
            <div class="producto-info">
              <span class="producto-nombre">{{ p.nombre }}</span>
              <span class="producto-precio">S/ {{ p.precio | number:'1.2-2' }}</span>
              <span class="producto-stock" [class.sin-stock]="p.stock <= 0">
                Stock: {{ p.stock > 0 ? p.stock + ' un.' : 'Agotado' }}
              </span>
            </div>
            <div class="producto-acciones">
              <button class="btn-detalle" (click)="verProducto(p.id)">Ver</button>
              <button class="btn-carrito" [disabled]="p.stock <= 0" (click)="agregarAlCarrito(p)">
                🛒 Agregar
              </button>
            </div>
          </div>
        </div>

        <span class="hora">{{ m.hora }}</span>
      </div>
    </div>

    <div *ngIf="cargando" class="mensaje malvino">
      <div class="burbuja escribiendo">
        <span>Malvino está escribiendo...</span>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <input 
      type="text" 
      [(ngModel)]="mensajeActual" 
      (keyup.enter)="enviar()" 
      placeholder="Pregunta por componentes, compatibilidad o tus pedidos..." 
    />
    <button (click)="enviar()" [disabled]="!mensajeActual.trim() || cargando">
      Enviar
    </button>
  </div>
</div>
